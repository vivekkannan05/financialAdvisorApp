spring:
  application:
    name: financial-advisor-api
  threads:
    virtual:
      enabled: true
  security:
    user:
      name: ${JWT_DEFAULT_USER:admin}
      password: ${JWT_DEFAULT_PASSWORD:changeme}

server:
  port: 8080
  servlet:
    context-path: /

# Spring AI - Ollama configuration
spring.ai:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat:
      options:
        model: ${LLM_MODEL:llama3.1:8b}
        temperature: 0.3
      timeout: ${LLM_TIMEOUT_SECONDS:30}s

# AWS DynamoDB
aws:
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
    region: ${AWS_REGION:us-east-1}
    table-name: ${DYNAMODB_TABLE:financial-profile}

# Application configuration
app:
  security:
    jwt:
      secret: ${JWT_SECRET:default-dev-secret-change-in-production-minimum-256-bits-long}
      expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    password:
      algorithm: ${PASSWORD_HASH_ALGORITHM:bcrypt}
      bcrypt-cost: ${BCRYPT_COST_FACTOR:12}
    encryption:
      key: ${ENCRYPTION_KEY:default-dev-key-change-in-production-must-be-32-bytes}
  financial:
    rounding-mode: ${FINANCIAL_ROUNDING_MODE:HALF_UP}
    scale: ${FINANCIAL_SCALE:2}
    staleness-threshold-days: ${STALENESS_THRESHOLD_DAYS:7}
    emergency-months-threshold: ${EMERGENCY_MONTHS_THRESHOLD:6}

# Actuator health endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

# Logging
logging:
  level:
    com.financialadvisor: INFO
    org.springframework.ai: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
