services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: fa-dynamodb
    user: root
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/data
    entrypoint: ["java", "-Djava.library.path=/home/dynamodblocal/DynamoDBLocal_lib"]
    command: ["-jar", "/home/dynamodblocal/DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: fa-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  api:
    build:
      context: ./financial-advisor-api
      dockerfile: Dockerfile
    container_name: fa-api
    ports:
      - "8080:8080"
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-llama3.1:8b}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
      - JWT_SECRET=${JWT_SECRET:-default-dev-secret-change-in-production-minimum-256-bits-long}
      - JWT_EXPIRY_MINUTES=${JWT_EXPIRY_MINUTES:-60}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-default-dev-key-change-in-production-must-be-32-bytes}
      - JWT_DEFAULT_USER=${JWT_DEFAULT_USER:-admin}
      - JWT_DEFAULT_PASSWORD=${JWT_DEFAULT_PASSWORD:-changeme}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - STALENESS_THRESHOLD_DAYS=${STALENESS_THRESHOLD_DAYS:-7}
      - EMERGENCY_MONTHS_THRESHOLD=${EMERGENCY_MONTHS_THRESHOLD:-6}
    depends_on:
      dynamodb-local:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./financial-advisor-ui
      dockerfile: Dockerfile
    container_name: fa-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      api:
        condition: service_healthy

volumes:
  dynamodb-data:
    name: fa-dynamodb-data
  ollama-data:
    name: fa-ollama-data
